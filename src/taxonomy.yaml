# Domain taxonomy for keyword-based classification.
#
# Structure: domains -> <domain> -> <language> -> <term>: <weight>
# Keys and domain names are English. Terms are multilingual on purpose:
# they must match Dutch / French / English ingested content.
#
# Terms are normalised the same way as the text (lowercase, accents
# stripped, simple trailing-"s" plurals removed), so write them naturally.
# Multi-word terms are matched as whole token sequences, longest first, so
# "algemene voorwaarden" is never double-counted with a shorter term.
#
# Weight guide:
#   3.0  strongly discriminating (ombudsman, aanrijdingsformulier, RGPD)
#   2.0-2.5  clearly domain-specific
#   1.0-1.5  indicative but shared with other contexts
#   0.3-0.5  generic (dossier, polis, amount)

