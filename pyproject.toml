[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "support-dataset-pipeline"
version = "0.1.0"
description = "Ingestion pipeline producing fine-tuning datasets for a customer-support model."
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "langdetect==1.0.9",
    "numpy==2.1.3",
    "psycopg[binary]==3.2.3",
    "spacy==3.8.2",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "ftfy==6.3.1",
    "xx_ent_wiki_sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20241230",
    # Synthetic document generation only (scripts/generate_documents.py).
    "fpdf2==2.8.1",
    "Pillow==12.1.1",
]

[tool.setuptools]
packages = ["src", "src.connectors", "src.processing", "src.dataset", "src.report", "src.synthetic", "src.processing.anonymize", "src.processing.parsers"]

[tool.setuptools.package-data]
src = ["taxonomy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# langdetect and fpdf2 ship no type hints.
module = ["langdetect", "langdetect.*", "fpdf", "fpdf.*"]
ignore_missing_imports = true
