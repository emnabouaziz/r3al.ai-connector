# End-to-end demo configuration: runs the whole pipeline on FakeConnector.
# The production sources live in config.production.yaml.
# Shortcuts taken here are listed in FAKES.md.
seed: 42
domains: [claims, policies, billing, onboarding, complaints, compliance]
languages: [nl, fr, en]

processing:
  taxonomy_path: ${TAXONOMY_PATH:-./src/taxonomy.yaml}
  language_min_chars: 40
  domain_threshold: 0.15
  domain_margin: 0.05

clean:
  min_chars: 20

anonymize:
  # Placeholders imposed by the client spec: [PERSON] [EMAIL] [PHONE] [IBAN] [NATIONAL_ID] [ADDRESS]
  pii_types: [PERSON, EMAIL, PHONE, IBAN, NATIONAL_ID, ADDRESS]
  ner_model: xx_ent_wiki_sm  # pinned in pyproject.toml, loaded offline

split:
  # Floors, minimums and ratios are counted in EXAMPLES; groups stay whole.
  eval_ratio: 0.2
  # Scaled down for a 60-document fake corpus (production: 25 / 5 / 20).
  eval_floor_per_domain: 2
  eval_floor_per_cell: 1
  max_share_per_domain: 0.35
  min_train_per_domain: 4  # examples; takes precedence over eval floors
  eval_ratio_max: 0.30  # hard ceiling on eval / kept

verify:
  near_duplicate_threshold: 0.9

build:
  # System prompt: "You are the support assistant of <insurer_name> ...".
  # The name comes from config only (synthetic placeholder by default).
  insurer_name: ${INSURER_NAME:-Example Insurance SA}
  # example_language: the system prompt is in the example's language (nl/fr/en),
  # so the model learns to answer in the customer's language. Or: english.
  system_prompt_language: example_language
  # Rejection thresholds of the example builders (see the report's build table).
  min_question_chars: 30
  min_answer_chars: 40
  max_placeholder_share: 0.12  # of the answer; real answers measured <= 0.09
  min_chunk_chars: 80
  max_answer_chars: 900

sources:
  - name: fake_demo
    type: fake
    config:
      seed: 42

output:
  dir: ./out
